parameters:
  - name: action
    displayName: Terraform action
    type: string
    default: plan
    values: [ plan, apply ]

  - name: stackPath
    displayName: Stack path
    type: string
    default: stacks/data-lz-core

  - name: terraformVersion
    displayName: Terraform version
    type: string
    default: 1.7.5

variables:
  # Expected in this variable group:
  # AZURE_SERVICE_CONNECTION = <Azure RM service connection display name>
  # TF_BACKEND_RG, TF_BACKEND_STORAGE, TF_BACKEND_CONTAINER
  # Optional: TF_BACKEND_KEY
  - group: DATA_PLATFORM_LZ_DEV

  - name: TF_IN_AUTOMATION
    value: "true"

pool:
  name: azure-devopsmanaged-pool

stages:
  # ----------------------------
  # 1) Fmt + Validate (always)
  # ----------------------------
  - stage: Validate
    displayName: Fmt + Validate
    jobs:
      - job: Validate
        displayName: Validate
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              if ! command -v unzip >/dev/null 2>&1; then
                echo "Installing unzip..."
                sudo apt-get update
                sudo apt-get install -y unzip
              else
                echo "unzip already present"
              fi
            displayName: Ensure unzip is installed

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - bash: |
              set -euo pipefail
              terraform version

              echo "==> terraform fmt (check only)"
              terraform fmt -check -diff -recursive

              echo "==> terraform init/validate (no backend)"
              cd "${{ parameters.stackPath }}"
              terraform init -backend=false -input=false -no-color
              terraform validate -no-color
            displayName: terraform fmt + validate

  # ----------------------------
  # 2) Plan (always)
  # ----------------------------
  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: Plan
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              if ! command -v unzip >/dev/null 2>&1; then
                echo "Installing unzip..."
                sudo apt-get update
                sudo apt-get install -y unzip
              else
                echo "unzip already present"
              fi
            displayName: Ensure unzip is installed

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - task: AzureCLI@2
            displayName: terraform init + plan
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                terraform version

                # Sanity check: service connection name must be provided
                : "${AZURE_SERVICE_CONNECTION:?AZURE_SERVICE_CONNECTION is required (variable group)}"

                cd "${{ parameters.stackPath }}"

                echo "==> Verify backend vars"
                : "${TF_BACKEND_RG:?TF_BACKEND_RG is required}"
                : "${TF_BACKEND_STORAGE:?TF_BACKEND_STORAGE is required}"
                : "${TF_BACKEND_CONTAINER:?TF_BACKEND_CONTAINER is required}"

                key="${TF_BACKEND_KEY:-${{ parameters.stackPath }}/terraform.tfstate}"
                echo "Using backend key: $key"

                echo "==> terraform init (backend)"
                terraform init -input=false -no-color \
                  -backend-config="resource_group_name=${TF_BACKEND_RG}" \
                  -backend-config="storage_account_name=${TF_BACKEND_STORAGE}" \
                  -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
                  -backend-config="key=${key}"

                if [ ! -f "terraform.tfvars" ]; then
                  echo "ERROR: terraform.tfvars not found in $PWD"
                  exit 1
                fi

                echo "==> terraform plan"
                terraform plan -no-color -var-file="terraform.tfvars" -out="$(Build.ArtifactStagingDirectory)/tfplan"

                echo "==> terraform show"
                terraform show -no-color "$(Build.ArtifactStagingDirectory)/tfplan" > "$(Build.ArtifactStagingDirectory)/tfplan.txt"

                # Keep lockfile with plan artifact if present
                if [ -f ".terraform.lock.hcl" ]; then
                  cp .terraform.lock.hcl "$(Build.ArtifactStagingDirectory)/"
                fi

          - publish: "$(Build.ArtifactStagingDirectory)"
            artifact: tfplan
            displayName: Publish tfplan artifact

  # ----------------------------
  # 3) Apply (only when action=apply, requires Environment approval)
  # ----------------------------
  - stage: Apply
    displayName: Terraform Apply (Requires Approval)
    dependsOn: Plan
    condition: >
      and(
        succeeded(),
        eq('${{ parameters.action }}', 'apply')
      )
    jobs:
      - deployment: Apply
        displayName: Apply
        environment: data-platform-lz-dev
        pool:
          name: azure-devopsmanaged-pool
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: |
                    set -euo pipefail
                    if ! command -v unzip >/dev/null 2>&1; then
                      echo "Installing unzip..."
                      sudo apt-get update
                      sudo apt-get install -y unzip
                    else
                      echo "unzip already present"
                    fi
                  displayName: Ensure unzip is installed

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: ${{ parameters.terraformVersion }}

                - download: current
                  artifact: tfplan
                  displayName: Download tfplan artifact

                - task: AzureCLI@2
                  displayName: terraform init + apply (from saved plan)
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      terraform version

                      : "${AZURE_SERVICE_CONNECTION:?AZURE_SERVICE_CONNECTION is required (variable group)}"

                      cd "${{ parameters.stackPath }}"

                      : "${TF_BACKEND_RG:?TF_BACKEND_RG is required}"
                      : "${TF_BACKEND_STORAGE:?TF_BACKEND_STORAGE is required}"
                      : "${TF_BACKEND_CONTAINER:?TF_BACKEND_CONTAINER is required}"

                      key="${TF_BACKEND_KEY:-${{ parameters.stackPath }}/terraform.tfstate}"

                      # Ensure provider versions match the plan (prevents drift between Plan and Apply)
                      if [ -f "$(Pipeline.Workspace)/tfplan/.terraform.lock.hcl" ]; then
                        cp "$(Pipeline.Workspace)/tfplan/.terraform.lock.hcl" ./.terraform.lock.hcl
                      fi

                      terraform init -input=false -no-color \
                        -backend-config="resource_group_name=${TF_BACKEND_RG}" \
                        -backend-config="storage_account_name=${TF_BACKEND_STORAGE}" \
                        -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
                        -backend-config="key=${key}"

                      echo "==> terraform apply (from approved saved plan)"
                      terraform apply -no-color -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"
