echo "==> Using service connection for Terraform auth"

export ARM_CLIENT_ID="$servicePrincipalId"
export ARM_TENANT_ID="$tenantId"
export ARM_SUBSCRIPTION_ID="$subscriptionId"
export ARM_USE_CLI=false

# If the service connection provides a secret, use it.
if [ -n "${servicePrincipalKey:-}" ]; then
  export ARM_CLIENT_SECRET="$servicePrincipalKey"
else
  # If we are on workload identity federation, Azure DevOps may provide an OIDC token file.
  if [ -n "${AZURE_FEDERATED_TOKEN_FILE:-}" ] && [ -f "${AZURE_FEDERATED_TOKEN_FILE}" ]; then
    export ARM_OIDC_TOKEN="$(cat "${AZURE_FEDERATED_TOKEN_FILE}")"
    export ARM_USE_OIDC=true
  else
    echo "ERROR: No servicePrincipalKey (client secret) and no AZURE_FEDERATED_TOKEN_FILE found. Check the service connection auth type and addSpnToEnvironment."
    exit 1
  fi
fi
