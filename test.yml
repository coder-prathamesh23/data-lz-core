echo "==> Using service connection for Terraform auth"
export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
export ARM_TENANT_ID="${tenantId:-$(az account show --query tenantId -o tsv)}"
export ARM_CLIENT_ID="${servicePrincipalId:-}"
export ARM_USE_CLI=false
if [ -n "${servicePrincipalKey:-}" ]; then
  export ARM_CLIENT_SECRET="$servicePrincipalKey"
elif [ -n "${idToken:-}" ]; then
  export ARM_USE_OIDC=true
  export ARM_OIDC_TOKEN="$idToken"
else
  echo "ERROR: AzureCLI@2 did not expose servicePrincipalKey or idToken. Ensure addSpnToEnvironment: true and the service connection auth type is SPN or Workload Identity."
  exit 1
fi
